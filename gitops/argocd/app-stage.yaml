apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mega-devops-app-stage
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ridhimavig/mega-devops-aks-project.git
    targetRevision: main
    path: kubernetes/overlays/stage
  destination:
    server: https://kubernetes.default.svc
    namespace: stage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
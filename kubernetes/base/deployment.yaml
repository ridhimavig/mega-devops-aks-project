apiVersion: apps/v1
kind: Deployment
metadata:
  name: mega-devops-app
  labels:
    app: mega-devops-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mega-devops-app
  template:
    metadata:
      labels:
        app: mega-devops-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: mega-devops-app
          image: ghcr.io/ridhimavig/mega-devops-app:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: ENVIRONMENT
              value: "base"
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10